spring.application.name=AIRevenueRecovery
server.forward-headers-strategy=framework

# Circuit Breaker
resilience4j.circuitbreaker.instances.razorpay.register-health-indicator=true
resilience4j.circuitbreaker.instances.razorpay.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.razorpay.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpay.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.razorpay.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.razorpay.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.razorpay.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.razorpay.automatic-transition-from-open-to-half-open-enabled=true

# Retry
resilience4j.retry.instances.razorpay.max-attempts=2
resilience4j.retry.instances.razorpay.wait-duration=1s

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_revenue_recovery
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI / Groq
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.2

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Kafka
spring.kafka.bootstrap-servers=localhost:29092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=ai-revenue-recovery
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Mail security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Payment API Rate Limiter
resilience4j.ratelimiter.instances.paymentApi.limit-for-period=10
resilience4j.ratelimiter.instances.paymentApi.limit-refresh-period=1m
resilience4j.ratelimiter.instances.paymentApi.timeout-duration=0

# Outbox Publisher
outbox.publisher.enabled=true
outbox.publisher.fixed-delay=5000
outbox.publisher.initial-delay=10000
outbox.publisher.batch-size=100
outbox.publisher.max-retries=5

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
#spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}