spring.application.name=AIRevenueRecovery

server.forward-headers-strategy=framework


# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ai_revenue_recovery}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# RESILIENCE4J - RAZORPAY
# =====================================================

resilience4j.circuitbreaker.instances.razorpay.register-health-indicator=true
resilience4j.circuitbreaker.instances.razorpay.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.razorpay.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpay.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.razorpay.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.razorpay.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.razorpay.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.razorpay.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.razorpay.max-attempts=2
resilience4j.retry.instances.razorpay.wait-duration=1s


# =====================================================
# GROQ / SPRING AI
# =====================================================

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.2


# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000


# =====================================================
# MAIL
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =====================================================
# REDIS
# =====================================================

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000ms


# =====================================================
# KAFKA
# =====================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.group-id=ai-revenue-recovery
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# =====================================================
# OUTBOX PUBLISHER
# =====================================================

outbox.publisher.enabled=true
outbox.publisher.fixed-delay=5000
outbox.publisher.initial-delay=10000
outbox.publisher.batch-size=100
outbox.publisher.max-retries=5
outbox.publisher.stale-minutes=10


# =====================================================
# FRONTEND
# =====================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# =====================================================
# RAZORPAY
# =====================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}


# =====================================================
# GOOGLE OAUTH 2.0
# =====================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}